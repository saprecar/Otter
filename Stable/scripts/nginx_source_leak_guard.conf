# [AI-BLOCK: Nginx Source Code & Dotfile Leak Prevention Configuration]
# Place inside your server { ... } block before proxying to FastAPI/Uvicorn.

# 1. Block access to .git, .git/HEAD, and all git internals
location ~* /\.git {
    # Allow only local loopback if necessary, otherwise return 404 for all
    allow 127.0.0.1;
    allow ::1;
    deny all;
    return 404;
}

# 2. Block all hidden dotfiles/folders (.env, .agents, .claude, etc.) except certbot ACME challenges
location ~ /\.(?!well-known) {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    return 404;
}

# 3. Block raw source code, database, and backup file downloads
location ~* \.(py|pyc|sql|db|sqlite3|bak|swp|ini|log|conf|sh|bat)$ {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    return 404;
}
